spring.application.name=api-gateway
server.port=${PORT:8765}

#auth-service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

#user-service
spring.cloud.gateway.server.webmvc.routes[1].id=user-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

#quiz-service
spring.cloud.gateway.server.webmvc.routes[2].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://quiz-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/quiz/**

#question-service
spring.cloud.gateway.server.webmvc.routes[3].id=question-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://question-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/question/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Configuration
jwt.secret=${JWT_SECRET:QuizAppSecretKeyForJWTAuthentication2026SuperSecureBase64EncodedKeyStringLength99}
